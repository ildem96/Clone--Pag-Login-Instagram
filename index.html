<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>Document</title>
    </head>
    <body>
        <main>
            <div id="main-container">
                <div class="banner-container">
                    <img src="banner2.png" alt="crie uma nota no instagram" width="200" />
                </div>
                <div class="form-container">
                    <div id="form-box">
                        <img id="logo-insta" src="logo_instagram.png" alt="logo instagram" width="200" />
                        <form action="#" id="login-form">
                            <input type="text" name="username" placeholder="Número, usuário ou email" />
                            <input type="password" name="password" placeholder="Senha" />
                            <input type="submit" value="Entrar" />
                        </form>
                        <div class="separator">
                            <div class="line"></div>
                            <span>Ou</span>
                        </div>

                        <div id="other-links">
                            <div id="facebook-login">
                                <a href="#">
                                    <img src="icons8-facebook-80.apng.png" alt="facebook" width="35" />
                                    <span>Entrar com Facebook</span>
                                </a>
                            </div>
                            <div id="forgot-pass">
                                <a href="#" target="_blank">Esqueceu a Senha?</a>
                            </div>
                        </div>
                    </div>
                    <div id="register-container">
                        <p>Não tem um conta? <a href="#">Cadastre-se</a></p>
                    </div>
                    <div id="get-app-container">
                        <p>Obtenha o aplicativo</p>
                        <a href="#">
                            <img
                                src="https://tillmannlaw.com/wp-content/uploads/2021/01/iPhone_App.png"
                                alt="appStore"
                                width="200" />
                        </a>
                        <a href="#">
                            <img
                                src="https://signableworld.files.wordpress.com/2019/11/download-google-play-store-logo.png"
                                alt="PlayStore"
                                width="200" />
                        </a>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <nav>
                <ul id="footer-links">
                    <li><a href="#">Meta</a></li>
                    <li><a href="#">Sobre</a></li>
                    <li><a href="#">Blog</a></li>
                    <li><a href="#">Ajuda</a></li>
                    <li><a href="#">API</a></li>
                    <li><a href="#">Privacidade</a></li>
                    <li><a href="#">Termos</a></li>
                    <li><a href="#">Principais Contas</a></li>
                    <li><a href="#">Hashtags</a></li>
                    <li><a href="#">Localização</a></li>
                    <li><a href="#">Instagram Lite</a></li>
                </ul>
            </nav>
            <p id="copyright">&copy; 2026 Instagram from Meta</p>
        </footer>
    </body>
</html>
